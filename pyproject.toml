[project]
name = "spacefrontiers-mcp"
version = "0.2.0"
description = "Space Frontiers MCP server — full-text retrieval over papers, books, patents, Wikipedia, Reddit, Telegram, YouTube."
requires-python = ">=3.10,<4"
dependencies = [
    "aiohttp>=3.11.0",
    "fastmcp (>=2.14.0,<4.0.0)",
    "pydantic>=2.7",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0,<1.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
