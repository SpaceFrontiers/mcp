# smithery.yaml — Machine Library MCP server
# https://smithery.ai/docs/build/project-config/smithery.yaml
#
# This server is hosted; Smithery does not need to build a container.
# Smithery forwards a Bearer API key; direct MCP clients may use hosted OAuth.

startCommand:
  type: http
  url: "https://mcp.machinelibrary.ai/"

configSchema:
  type: object
  required: ["apiKey"]
  properties:
    apiKey:
      type: string
      title: "Machine Library API key"
      description: "Get a key at https://spacefrontiers.org/keys. Sent as `Authorization: Bearer <key>`."
      x-from: header
      x-header-name: "Authorization"
      x-header-prefix: "Bearer "

exampleConfig:
  apiKey: "sf_live_xxxxxxxxxxxxxxxx"
